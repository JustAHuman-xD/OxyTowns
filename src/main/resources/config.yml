# These are the upgrades settings. This is where you can define how much you unlock and how much they cost.
upgrades:
  CLAIMS:
    display-name: "Claims"
    upgrade:
      # The first number indicates the amount of claims. The second number indicates the cost of the upgrade.
      # "25: 500.0" means that you will unlock 25 claims for $500.
      25: 500.0
      50: 25000.0
      150: 50000.0
      250: 100000.0
      500: 250000.0
      750: 500000.0
      1000: 1000000.0
  MEMBERS:
    display-name: "Members"
    upgrade:
      # The first number indicates the amount of members. The second number indicates the cost of the upgrade.
      # "10: 500.0" means that you will unlock 10 total members for $500.
      10: 500.0
      25: 2500.0
      50: 15000.0
      75: 50000.0
      100: 150000.0
      150: 350000.0
      250: 500000.0
  BANK_CAPACITY:
    display-name: "Bank Capacity"
    upgrade:
      # The first number indicates the max balance. The second number indicates the cost of the upgrade.
      # "1000000.0: 250000.0" means that you will unlock a max balance of $1,000,000 for $250,000.
      1000000.0: 250000.0
      1500000.0: 500000.0
      3000000.0: 750000.0
      5000000.0: 1500000.0
      10000000.0: 2500000.0
  VAULT_AMOUNT:
    display-name: "Vault Amount"
    upgrade:
      # The first number indicates the amount of vaults. The second number indicates the cost of the upgrade.
      # "2: 1000.0" means that you will unlock 2 total vaults for $1,000.
      2: 1000.0
      3: 2500.0
      4: 5000.0
      5: 10000.0
      6: 25000.0
      8: 50000.0
      9: 75000.0
  OUTPOSTS:
    display-name: "Outposts"
    upgrade:
      # The first number indicates the amount of vaults. The second number indicates the cost of the upgrade.
      # "1: 1000.0" means that you will unlock 2 total vaults for $1,000.
      1: 1000.0
      2: 2500.0
      3: 5000.0
      4: 15000.0
      5: 25000.0
      6: 50000.0
      7: 100000.0

# Whether PVP is allowed in wilderness. If this is set to false, PVP will only be allowed in arena plots.
allow-pvp-in-wilderness: true

# If enabled, when a player enters or leaves a town that has pvp enabled/disabled, they will have a notification about the pvp status change.
pvp-status-enter-exit-messages: true

# For how long in seconds after leaving a pvp-disabled town, should a player still have pvp disabled. (set to 0 to disable)
leave-no-pvp-grace-period: 30

# These are the worlds where players can NOT claim land.
blacklisted-worlds:
  - example_world

# Town upkeep settings.
# Upkeep will be collected once a day. This money will be withdrawn from all town banks.
upkeep:
  # Whether upkeep is enabled.
  enabled: true
  # Leniency allows towns to miss an upkeep payment (or multiple depending on configuration) before the town is fully disbanded.
  leniency:
    # Whether leniency is enabled. If enabled, instead of being fully disbanded when missing upkeep, the town will have all claims destroyed, but will remain. If the town misses another payment after that, it will be disbanded.
    enabled: true
    # If towns should automatically sell outposts to try and cover the cost of upkeep if they can't afford it.
    sell-outposts: true
  # should a backup of the town be created under towns_backups/upkeep_disband/ before being disbanded from missing upkeep.
  backup-before-disband: true
  # This is the amount that the server will collect for every claimed chunk a town has.
  town-value: 25.0
  # The settings below define what time upkeep will be collected.
  hour: 12
  timezone: America/New_York

town-bank:
  # Whether town banks should be enabled.
  # DISABLING NOT YET IMPLEMENTED
  enabled: true
  # If you should be able to access the town bank outside the town.
  access-outside-town: true

town-vaults:
  # Whether town vaults should be enabled.
  # DISABLING NOT YET IMPLEMENTED
  enabled: true
  # If you should be able to access the town vaults outside the town.
  access-outside-town: true
  # How many rows each vault should have
  vault-rows: 6

# We provide a barebones town chat system. It's up to your chat plugin for a more robust system.
town-chat:
  # Whether town chat is enabled.
  enabled: true
  # This is the format of the town chat message.
  format: "<green>[Town] <white><sender>: <gray><message>"
  # This is the format for any players using /townchatspy (e.g. staff)
  spy-format: "<red>[TownSpy] <white><town>@<sender>: <gray><message>"

# We support queuing notifications for offline players when important town events occur.
notifications:
  # Whether offline notifications are enabled.
  enabled: true
  # The delay (in seconds) after a player joins before they receive their queued notifications.
  delay-after-join: 15

hooks:
  # Whether the bStats integration is enabled.
  bstats: true

  # Whether the PlaceholderAPI integration is enabled.
  placeholder-api: true

  squaremap:
    # Whether the Squaremap integration is enabled.
    enabled: true
    # How often in seconds should the town map markers be updated. (This is done asynchronously)
    update-interval: 30

  pvp-manager:
    # Whether the pvp manager integration is enabled. If it is it just doesn't tell a player they've entered a safe zone if they are already in combat.
    enabled: true
