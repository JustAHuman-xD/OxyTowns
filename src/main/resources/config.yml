# This is how much it costs for a town to claim a chunk.
claim-price: 150.0

# This is how much it costs for a town to claim an outpost.
outpost-price: 50000.0

# This is how much is refunded to a town when unclaiming an outpost (set to 0 to disable).
outpost-refund: 10000.0

# This is the max chunk radius players can claim using /t claim <radius>.
# Setting this to 3 means that a 7x7 (total of 49 chunks) can be claimed at once.
max-claim-radius: 3

town-ban-expel:
  # Whether banned players should be forcefully expelled from towns they are banned from. (If they manage to enter the town somehow, or if they are in the town at the moment of being banned)
  enabled: true
  # How should the player be expelled, see options below.
  mode: "custom" # Options: "world_spawn", "respawn_point", "command", "custom"
  # If the mode is command, this is the command that will be run by the console. <player> will be replaced with the player's name.
  command: spawn <player>
  # If the mode is custom, this is the location the player will be teleported to.
  custom:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

